<style>

    --line: #e2e8f0; --hover: #f1f5f9; --active: #eff6ff; --accent: #2563eb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink);
               overscroll-behavior: none; }
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; height: 100dvh; }
  aside { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: #fff; min-height: 0; z-index: 1000; }
  aside > * { flex: none; }
  .grab, .t-short { display: none; }
  header { padding: 16px 16px 12px; }
  h1 { font-size: 16px; line-height: 1.3; margin: 0 0 4px; }
  .sub { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .controls { padding: 0 16px 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  input, select { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px;

  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
  .chip { display: flex; align-items: center; justify-content: center; gap: 6px; height: 30px; border: 1px solid var(--line); border-radius: 999px;
          font: inherit; font-size: 12px; color: var(--ink); cursor: pointer; user-select: none; background: #fff; transition: opacity .15s; }
  .chip:hover { background: var(--hover); }
  .chip.off { opacity: .4; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(15, 23, 42, .15); }
  .statusbar { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); min-height: 18px; }
  .linkbtn { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; }
  .linkbtn:hover { text-decoration: underline; }
  .sortbtns { display: inline-flex; align-items: center; gap: 2px; }
  .sortbtns button { border: 0; background: none; font: inherit; font-size: 12px; color: var(--muted); padding: 2px 6px; border-radius: 6px; cursor: pointer; }
  .sortbtns button.on { background: var(--hover); color: var(--ink); font-weight: 600; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
  #list li { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; border-left: 3px solid transparent; }
  #list li:hover { background: var(--hover); }
  #list li.active { background: var(--active); border-left-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; }
  .name { font-weight: 600; font-size: 13px; flex: 1; min-width: 0; }
  .booth { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 3px; padding-left: 18px; line-height: 1.4; }
  #list li.empty { cursor: default; background: none; border-left-color: transparent; padding: 32px 16px; text-align: center; color: var(--muted); font-size: 13px; }
  details { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  summary { cursor: pointer; }
  details p { margin: 6px 0 0; line-height: 1.5; max-height: 160px; overflow-y: auto; }
  #detail { display: none; }
  #map { height: 100%; background: #f5f3ef; }

  .leaflet-container { font: inherit; }
  .leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: 0 6px 24px rgba(15, 23, 42, .18); }
  .leaflet-popup-content { font-size: 13px; line-height: 1.45; margin: 12px 14px; min-width: 220px; }
  .pop-title { font-weight: 700; font-size: 14px; padding-right: 12px; }
  .pop-muted { color: var(--muted); font-size: 12px; }
  .pop-city { margin-top: 8px; font-weight: 600; }
  .pop-others { margin: 4px 0 0; padding-left: 16px; font-size: 12px; color: var(--muted); }
  .pop-others a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .pop-others a:hover { text-decoration: underline; }
  .pop-link { display: inline-block; margin-top: 8px; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 12px; }
  .pop-link:hover { text-decoration: underline; }

  .has-selection .leaflet-overlay-pane, .has-selection .leaflet-marker-pane { opacity: .35; transition: opacity .2s; }
  .cluster { display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 700; font-size: 12px;
             background: rgba(15, 23, 42, .82); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(15, 23, 42, .35); }
  .venue-pin { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #dc2626;
               color: #fff; font-size: 15px; border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, .4); }
  .site-label { background: none; border: 0; box-shadow: none; padding: 0; font-size: 11px; font-weight: 600; color: var(--ink);
                max-width: 150px; overflow: hidden; text-overflow: ellipsis;
                text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff, 0 0 4px #fff; }
  .site-label::before { display: none; }
  .has-selection .site-label { opacity: .3 !important; }  /* Leaflet sets tooltip opacity inline */
  .cl-list { list-style: none; margin: 8px -14px 0; padding: 0; max-height: 260px; overflow-y: auto; border-top: 1px solid var(--line); }
  .cl-list a { display: flex; align-items: center; gap: 8px; padding: 7px 14px; color: var(--ink); text-decoration: none; cursor: pointer; }
  .cl-list a:hover { background: var(--hover); }
  .cl-list .cl-name { font-weight: 600; flex: 1; min-width: 0; }
  .cl-list .cl-city { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .area-tag { display: inline-flex; align-items: center; gap: 4px; }
  .sel-label { background: var(--ink); color: #fff; border: 0; border-radius: 6px; font-size: 11px; font-weight: 600; padding: 3px 7px; box-shadow: none; }
  .sel-label::before { display: none; }
  .leaflet-control-attribution { font-size: 11px; }
  .legend { background: #fff; padding: 8px 10px; border-radius: 8px; box-shadow: 0 1px 5px rgba(15, 23, 42, .2); font-size: 12px; line-height: 1.8; }
  .legend .dot { margin-right: 6px; vertical-align: -1px; }

  /* ---------- phone: full-screen map with a draggable bottom sheet ---------- */
  @media (max-width: 760px) {
    html, body { overflow: hidden; }
    .app { display: block; height: 100%; }
    #map { position: fixed; inset: 0; height: auto; }
    .legend, .leaflet-control-zoom, .sub, .t-long, aside > details { display: none; }
    .t-short { display: inline; }
    .leaflet-top { top: env(safe-area-inset-top); }
    .leaflet-control-attribution { font-size: 9px; border-radius: 0 0 0 6px; }

    aside { position: fixed; left: 0; right: 0; bottom: 0; height: 50%; border: 0; border-radius: 16px 16px 0 0;

    aside.anim { transition: height .28s cubic-bezier(.2, .8, .2, 1); }
    .grab { display: flex; justify-content: center; align-items: center; height: 22px; cursor: grab; touch-action: none; }
    .grab span { width: 38px; height: 5px; border-radius: 3px; background: #cbd5e1; }
    header { padding: 0 16px 8px; touch-action: none; }
    h1 { font-size: 16px; margin: 0; }
    .controls { padding: 0 0 8px; gap: 10px; }
    #q { margin: 0 16px; width: calc(100% - 32px); }
    input, select { height: 44px; font-size: 16px; border-radius: 12px; background-color: #f1f5f9; border-color: transparent; }

    .filters { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; touch-action: pan-x; }

    .filters .chip, .filters select { flex: none; width: auto; height: 36px; border-radius: 999px; font-size: 14px; }

    .d-booth b { font-size: 18px; font-variant-numeric: tabular-nums; }
    .d-meta { margin-top: 6px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .d-body { overflow-y: auto; overscroll-behavior: contain; flex: 1 1 auto; min-height: 0; padding-bottom: 12px; }

    .d-sites li.on { background: var(--active); border-left-color: var(--accent); }

    .d-sites .txt { flex: 1; min-width: 0; }
    .d-sites b { display: block; font-size: 15px; }
    .d-sites span { font-size: 13px; color: var(--muted); }
    .d-sites .chev { color: var(--faint); font-size: 18px; }
    .d-actions { display: grid; gap: 8px; padding: 12px 16px 4px; }
    .d-cta { display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px; background: var(--accent); color: #fff;
             font-weight: 600; font-size: 16px; text-decoration: none; }
  }
</style>

<div class="app">
  <aside id="sheet">

    </div>
    <ul id="list"></ul>
    <div id="detail"></div>
    <details>

      <p id="skipped"></p>
    </details>
  </aside>
  <div id="map"></div>
</div>

// ---------- bottom sheet (phone only) ----------
const sheet = $('sheet');
const SNAPS = ['peek', 'mid', 'full'];
let snap = 'mid';

const offsetIn = el => el.getBoundingClientRect().top - sheet.getBoundingClientRect().top;
function sheetHeights() {
  const H = window.innerHeight;
  const full = H - 64;
  const detail = sheet.classList.contains('detail-mode');
  const peek = detail ? offsetIn(sheet.querySelector('.d-body')) : offsetIn($('list'));
  const content = detail ? offsetIn(sheet.querySelector('.d-body')) + sheet.querySelector('.d-body').scrollHeight + 8 : H;
  const mid = Math.min(Math.round(H * (detail ? 0.6 : 0.5)), content);
  return { peek: Math.round(peek), mid: Math.max(mid, Math.round(peek)), full };
}
function setSnap(s, animate = true) {
  snap = s;
  if (!phone) { sheet.style.height = ''; return; }
  sheet.classList.toggle('anim', animate);
  sheet.style.height = sheetHeights()[s] + 'px';
}
const visibleSheet = () => (phone ? sheetHeights()[snap] : 0);
// keep things clear of the sheet on phones, and of the edges everywhere
function fitPadding() {
  return phone ? { paddingTopLeft: [8, 40], paddingBottomRight: [8, visibleSheet() + 16] } : { padding: [24, 24] };
}

let drag = null;
sheet.addEventListener('pointerdown', e => {
  if (!phone || e.button > 0 || e.target.closest('input, select, button, a, #list, .d-body, details')) return;
  drag = { y: e.clientY, h: sheet.getBoundingClientRect().height, t: performance.now(), last: e.clientY, lastT: performance.now(), moved: false };
  try { sheet.setPointerCapture(e.pointerId); } catch {}
  sheet.classList.remove('anim');
});
sheet.addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = drag.y - e.clientY;
  if (Math.abs(dy) > 5) drag.moved = true;
  const { peek, full } = sheetHeights();
  sheet.style.height = Math.max(peek - 24, Math.min(full, drag.h + dy)) + 'px';
  drag.v = (drag.last - e.clientY) / Math.max(1, performance.now() - drag.lastT);
  drag.last = e.clientY; drag.lastT = performance.now();
});
const endDrag = e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) { if (e.target.closest('.grab')) setSnap(snap === 'peek' ? 'mid' : 'peek'); else setSnap(snap); return; }
  const h = sheet.getBoundingClientRect().height, hs = sheetHeights();
  let i = SNAPS.indexOf(SNAPS.reduce((a, b) => Math.abs(hs[b] - h) < Math.abs(hs[a] - h) ? b : a));
  if (d.v > 0.4) i = Math.min(2, SNAPS.indexOf(snap) + 1);         // flick up
  else if (d.v < -0.4) i = Math.max(0, SNAPS.indexOf(snap) - 1);   // flick down
  setSnap(SNAPS[i]);
};
sheet.addEventListener('pointerup', endDrag);

const fits = new Set(['High', 'Medium']);
let sortBy = 'name';

document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
  const f = ch.dataset.fit;
  fits.has(f) ? fits.delete(f) : fits.add(f);
  ch.classList.toggle('off', !fits.has(f));
  ch.setAttribute('aria-pressed', fits.has(f));
  render();
}));
document.querySelectorAll('.sortbtns button').forEach(b => b.addEventListener('click', () => {
  sortBy = b.dataset.sort;
  document.querySelectorAll('.sortbtns button').forEach(x => x.classList.toggle('on', x === b));
  render();
}));

function officeMatches(c, o, q, state) {
  if (state && o.state !== state) return false;
  if (!q) return true;
  // a company-level match (name or sector) keeps all of its sites; otherwise only matching sites
  return [c.name, c.sector, c.group].join(' ').toLowerCase().includes(q) || (o.city + ' ' + o.note).toLowerCase().includes(q);
}

let area = null;   // markers of the cluster tapped on a phone, or null

function filtered() {
  const q = $('q').value.trim().toLowerCase();
  const group = $('group').value, state = $('state').value;
  return COMPANIES
    .filter(c => fits.has(c.fit) && (!group || c.group === group))
    .map(c => ({ c, idx: c.offices.map((o, i) => officeMatches(c, o, q, state) && (!area || area.has(c.markers[i])) ? i : -1).filter(i => i >= 0) }))
    .filter(x => x.idx.length);
}

const listEl = $('list');

function render() {
  const shown = filtered();
  if (sortBy === 'booth') shown.sort((a, b) => +a.c.booth - +b.c.booth);
  // the area only narrows the list; the map keeps every site that matches the filters
  const onMap = area ? (() => { const a = area; area = null; const all = filtered(); area = a; return all; })() : shown;
  cluster.clearLayers();
  cluster.addLayers(onMap.flatMap(x => x.idx.map(i => x.c.markers[i])));

  listEl.innerHTML = '';
  if (!shown.length) listEl.innerHTML = '<li class="empty">No companies match these filters.</li>';
  shown.forEach(({ c, idx }) => {
    const li = document.createElement('li');
    li.classList.toggle('active', c === active);
    li.dataset.name = c.name;
    li.innerHTML = `<div class="row"><span class="dot" style="background:${COLORS[c.fit]}"></span><span class="name">${esc(c.name)}</span><span class="booth">Booth ${esc(c.booth)}</span></div>
      <div class="meta">${esc(c.sector)} · ${idx.map(i => esc(c.offices[i].city)).join('; ')}</div>`;
    li.addEventListener('click', () => openCompany(c, null, { idx }));
    listEl.appendChild(li);
  });

  ['group', 'state'].forEach(id => $(id).classList.toggle('set', !!$(id).value));
  const sites = shown.reduce((a, x) => a + x.idx.length, 0);
  const filteredNow = $('q').value || $('group').value || $('state').value || fits.size < 2;
  $('stats').innerHTML = (area ? `${sites} sites in this area` : `${shown.length} companies · ${sites} sites`) +
    (area ? ' · <button class="linkbtn" id="showall">Show all</button>' : filteredNow ? ' · <button class="linkbtn" id="clear">Clear</button>' : '');
  if (area) $('showall').onclick = () => { area = null; render(); };
  else if (filteredNow) $('clear').onclick = resetAll;
  if (active && !shown.some(x => x.c === active)) closeCompany();
}

// ---------- selection ----------
function setActive(c, scroll = true) {
  if (active) active.markers.forEach(labelOn);
  if (c) c.markers.forEach(labelOff);
  active = c;
  selection.clearLayers();
  listEl.querySelectorAll('li').forEach(li => li.classList.toggle('active', !!c && li.dataset.name === c.name));
  map.getContainer().classList.toggle('has-selection', !!c);
  if (!c) return;
  c.offices.forEach((o, i) => {
    L.circleMarker([o.lat, o.lon], { pane: 'selected', radius: phone ? 15 : 13, color: COLORS[c.fit], weight: 2.5, fill: false, interactive: false }).addTo(selection);
    const m = L.circleMarker([o.lat, o.lon], { pane: 'selected', radius: phone ? 9 : 7, color: '#fff', weight: 2, fillColor: COLORS[c.fit], fillOpacity: 1 })
      .bindTooltip(o.city, { permanent: true, direction: 'auto', offset: [phone ? 14 : 12, 0], className: 'sel-label' })
      .on('click', e => { L.DomEvent.stopPropagation(e); phone ? showSite(c, i) : m.openPopup(); })
      .addTo(selection);
    if (!phone) m.bindPopup(() => popupHtml(c, o), { maxWidth: 320 });
    o.selMarker = m;
  });
  if (scroll && !phone) listEl.querySelector('li.active')?.scrollIntoView({ block: 'nearest' });
}

function flyToPoints(pts, maxZoom) {
  map.closePopup();
  map.flyToBounds(L.latLngBounds(pts).pad(pts.length > 1 ? 0.15 : 0), { ...fitPadding(), maxZoom, duration: 0.8 });
}

// open a company: desktop shows popups, phones show a company page in the sheet
function openCompany(c, officeIdx = null, { fly = true, idx = c.offices.map((_, i) => i) } = {}) {
  setActive(c, officeIdx !== null);
  if (phone) {
    renderDetail(c, officeIdx);
    sheet.classList.add('detail-mode');
    sheet.querySelector('.d-body').scrollTop = 0;
    setSnap('mid');
  }
  if (!fly && officeIdx !== null) {
    // phones: keep the zoom but slide the tapped site above the sheet
    if (phone) flyToPoints([[c.offices[officeIdx].lat, c.offices[officeIdx].lon]], map.getZoom());
    else c.offices[officeIdx].selMarker.openPopup();
    return;
  }
  flyToPoints(idx.map(i => [c.offices[i].lat, c.offices[i].lon]), idx.length > 1 ? 8 : 9);
  if (!phone) map.once('moveend', () => c.offices[officeIdx ?? idx[0]].selMarker?.openPopup());
}

function openSite(c, i) {
  setActive(c);
  flyToPoints([[c.offices[i].lat, c.offices[i].lon]], Math.max(map.getZoom(), 8));
  map.once('moveend', () => c.offices[i].selMarker?.openPopup());
}

function closeCompany() {
  setActive(null);
  map.closePopup();
  if (sheet.classList.contains('detail-mode')) {
    sheet.classList.remove('detail-mode');
    setSnap(snap === 'peek' ? 'peek' : 'mid');
  }
}

      <div class="d-label">Engineering sites</div>
      <ul class="d-sites">${c.offices.map((o, i) => `
        <li data-i="${i}" class="${i === on ? 'on' : ''}"><span class="pin" style="background:${COLORS[c.fit]}"></span>
          <div class="txt"><b>${esc(o.city)}</b><span>${esc(o.note)}</span></div><span class="chev">›</span></li>`).join('')}
      </ul>
      <div class="d-actions">
        ${c.url ? `<a class="d-cta" href="${esc(c.url)}" target="_blank" rel="noopener">Careers and website ↗</a>` : ''}
      </div>
    </div>`;
  $('detail').querySelector('.d-back').onclick = closeCompany;
  $('detail').querySelectorAll('.d-sites li').forEach(li => li.onclick = () => showSite(c, +li.dataset.i));
}

function showSite(c, i) {
  $('detail').querySelectorAll('.d-sites li').forEach(li => li.classList.toggle('on', +li.dataset.i === i));
  if (snap === 'full') setSnap('mid');
  flyToPoints([[c.offices[i].lat, c.offices[i].lon]], Math.max(map.getZoom(), 9));
}

// ---------- reset and events ----------
function resetAll() {
  $('q').value = ''; $('group').value = ''; $('state').value = ''; area = null;
  fits.add('High'); fits.add('Medium');
  document.querySelectorAll('.chip').forEach(ch => { ch.classList.remove('off'); ch.setAttribute('aria-pressed', true); });
  closeCompany();
  render();
  map.flyToBounds(US_BOUNDS, { ...fitPadding(), duration: 0.8 });
}

map.on('click', () => {
  if (active) closeCompany();
  else if (phone && snap !== 'peek') setSnap('peek');
});
map.on('dragstart', () => { if (phone && snap === 'full') setSnap('mid'); });
$('q').addEventListener('input', render);
$('q').addEventListener('focus', () => { if (phone) setSnap('full'); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.target.blur(); if (phone) setSnap('mid'); } });
$('group').addEventListener('change', render);
$('state').addEventListener('change', () => {
  render();
  if (!$('state').value) return;
  const pts = filtered().flatMap(x => x.idx.map(i => [x.c.offices[i].lat, x.c.offices[i].lon]));
  if (pts.length) flyToPoints(pts, 9);
});
$('skipCount').textContent = SKIPPED.length;
$('skipped').textContent = 'Universities, professional societies, finance, insurance, pure software, and civil-only or environmental-only firms were left off: ' + SKIPPED.join(', ') + '.';

function applyLayout() {
  phone = phoneQuery.matches;
  map.attributionControl.setPosition(phone ? 'topright' : 'bottomright');
  if (!phone) { sheet.classList.remove('detail-mode', 'anim'); sheet.style.height = ''; }
  else setSnap(snap, false);
}
phoneQuery.addEventListener('change', () => { closeCompany(); applyLayout(); });
window.addEventListener('resize', () => { if (phone && !drag) setSnap(snap, false); });

render();
applyLayout();
// fit the US once the map has a real size (it can be 0 in a hidden tab or a lazy iframe)
let fitted = false;
new ResizeObserver(() => {
  map.invalidateSize();
  if (!fitted && map.getSize().x > 0) { map.fitBounds(US_BOUNDS, { ...fitPadding(), animate: false }); fitted = true; }
}).observe(map.getContainer());
</script>
</body>
</html>
